name: Incremental CDC
on:
  pull_request:
    paths:
      - 'optd-incremental/**'
      - 'optd-incremental-sql/**'
      - 'optd-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/agent-check.sh'
      - '.github/workflows/incremental.yaml'
  push:
    branches: [main]
    paths:
      - 'optd-incremental/**'
      - 'optd-incremental-sql/**'
      - 'optd-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/agent-check.sh'
      - '.github/workflows/incremental.yaml'
permissions:
  contents: read
jobs:
  sql-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Explicitly prepare hash-pinned public query sources
        run: python3 optd-incremental-sql/benchmarks/tools/fetch_duckdb_sources.py
      - name: Verify pinned inputs and run strict qualification-tool tests
        run: scripts/agent-check.sh sql-tools
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy
      - name: Typed SQL, independent oracle and process recovery gates
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/optd-sql-target
        run: scripts/agent-check.sh sql
  cdc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy
      - name: Protocol, core and real process recovery gates
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/optd-cdc-target
        run: scripts/agent-check.sh iceberg

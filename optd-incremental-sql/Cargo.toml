[package]
name = "optd-incremental-sql"
description = "Typed SQL incremental maintenance with atomic local checkpoints"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.95"

[features]
# Typed source ingestion is opt-in; the default graph/store has no catalog IO.
iceberg = ["dep:iceberg", "dep:optd-incremental"]

[dependencies]
# Implement DataFusion's async table-provider API without a new resolved package.
async-trait = "0.1"
# Generic Optd plans and transformation/implementation rules; SQL stays typed.
optd-core = { path = "../optd-core" }
# Reuse the workspace's pinned SQL/type implementation. The default graph has
# no catalog dependency; optional IO reuse never uses the legacy Value bridge.
datafusion = { version = "55.0.0", default-features = false, features = ["sql", "datetime_expressions", "regex_expressions", "string_expressions", "unicode_expressions", "nested_expressions", "math_expressions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
iceberg = { git = "https://github.com/apache/iceberg-rust", rev = "5b82ab99aeaf50bf4f5b3b776ac9cd6380a5f3e3", optional = true }
# DML source-stream work accounting uses the already-resolved Stream API.
futures = { version = "0.3" }
# Reuse only the qualified local catalog; do not reuse its lossy Value adapter.
optd-incremental = { path = "../optd-incremental", features = ["iceberg"], optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "time"] }

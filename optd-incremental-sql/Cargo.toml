[package]
name = "optd-incremental-sql"
description = "Typed SQL incremental maintenance with atomic local checkpoints"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.95"

[dependencies]
# Reuse the workspace's pinned SQL/type implementation. Storage and the legacy
# optd bridge are deliberately not dependencies of the typed execution layer.
datafusion = { version = "55.0.0", default-features = false, features = ["sql", "datetime_expressions", "regex_expressions", "string_expressions", "unicode_expressions", "nested_expressions", "math_expressions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "time"] }
